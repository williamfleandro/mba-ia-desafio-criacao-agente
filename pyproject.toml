[project]
name = "aurora"
version = "1.0.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.11.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.scripts]
aurora-api = "aurora.api:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore:GOOGLE_GENAI_USE_VERTEXAI is deprecated:DeprecationWarning"]
